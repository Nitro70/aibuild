org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ is not fully compatible with the configuration cache yet.
org.gradle.configuration-cache=false

# Point Gradle at the portable JDK 25. Minecraft 26.1+ requires Java 25.
org.gradle.java.installations.paths=D:/tools/jdk25/jdk-25.0.3+9

# Minecraft / Fabric. Verified against https://fabricmc.net/develop for 26.3.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.161.0+26.3

# Mod
mod_version=0.3.3
maven_group=dev.nitro.aibuild
java_version=25

# Third party
gson_version=2.14.0
junit_version=5.11.4
